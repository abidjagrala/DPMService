{% load crispy_forms_tags %}
<form hx-post="{% url 'assets:asset_quick_create' %}"
      hx-swap="none"
      hx-on::after-request="handleQuickAddResponse(event, 'asset')"
      class="space-y-3">
    {% csrf_token %}
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Asset Tag <span class="text-error">*</span></span></label>
        <input type="text" name="asset_tag" class="input input-bordered input-sm w-full" placeholder="Auto-generated if left blank">
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Asset Type <span class="text-error">*</span></span></label>
        <select name="asset_type" class="select select-bordered select-sm w-full" required>
            <option value="">Select type...</option>
            {% for at in asset_types %}
                <option value="{{ at.pk }}">{{ at.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Brand/Model</span></label>
        <input type="text" name="brand_model" class="input input-bordered input-sm w-full">
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Serial Number</span></label>
        <input type="text" name="serial_number" class="input input-bordered input-sm w-full">
    </div>
    <input type="hidden" name="client" value="">
    <input type="hidden" name="status" value="available">
    <input type="hidden" name="is_active" value="on">
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="btn btn-ghost btn-sm" @click="$dispatch('close-quick-add')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Create</button>
    </div>
</form>
