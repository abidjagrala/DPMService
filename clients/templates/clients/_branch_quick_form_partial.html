{% load i18n %}

<div class="p-4">
    <h3 class="font-semibold text-lg mb-3">{% trans "Quick Add Branch" %}</h3>
    <form hx-post="{% url 'clients:branch_quick_create' %}"
          hx-target="#quick-add-form"
          hx-swap="innerHTML"
          id="quick-add-form"
          class="space-y-3">
        <div class="form-control">
            <label class="label"><span class="label-text text-sm font-medium">{% trans "Branch Name" %} <span class="text-error">*</span></span></label>
            <input type="text" name="name" class="input input-bordered input-sm w-full" required>
        </div>
        <div class="form-control">
            <label class="label"><span class="label-text text-sm font-medium">{% trans "Address" %}</span></label>
            <textarea name="address" class="textarea textarea-bordered w-full" rows="2"></textarea>
        </div>
        <div class="flex justify-end gap-2">
            <button type="button" class="btn btn-ghost btn-sm" @click="window.dispatchEvent(new CustomEvent('close-quick-add'))">{% trans "Cancel" %}</button>
            <button type="submit" class="btn btn-primary btn-sm">{% trans "Create" %}</button>
        </div>
    </form>
</div>
