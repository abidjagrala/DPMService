{% load crispy_forms_tags %}
<form hx-post="{% url 'clients:client_quick_create' %}"
      hx-swap="none"
      hx-on::after-request="handleQuickAddResponse(event, 'client')"
      class="space-y-3">
    {% csrf_token %}
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Company Name <span class="text-error">*</span></span></label>
        <input type="text" name="company_name" class="input input-bordered input-sm w-full" required>
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Contact Person</span></label>
        <input type="text" name="contact_person" class="input input-bordered input-sm w-full">
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Email <span class="text-error">*</span></span></label>
        <input type="email" name="email" class="input input-bordered input-sm w-full" required>
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Phone <span class="text-error">*</span></span></label>
        <input type="text" name="phone" class="input input-bordered input-sm w-full" required>
    </div>
    <div class="form-control">
        <label class="label py-1"><span class="label-text text-sm font-medium">Address</span></label>
        <textarea name="address" class="textarea textarea-bordered textarea-sm w-full" rows="2"></textarea>
    </div>
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="btn btn-ghost btn-sm" @click="$dispatch('close-quick-add')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Create</button>
    </div>
</form>
